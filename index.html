<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для тебя</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#111;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    text-align:center;
}

.container{
    max-width:700px;
    padding:30px;
}

input{
    width:80%;
    max-width:400px;
    padding:12px;
    border:none;
    border-radius:8px;
    margin-top:15px;
}

button{
    margin-top:15px;
    padding:12px 24px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

#content{
    display:none;
}

iframe{
    width:100%;
    height:80vh;
    border:none;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="container" id="login">
    <h1>the song i associate you with</h1>
    <p>enter the password</p>

    <input type="password" id="password">
    <br>
    <button onclick="checkPassword()">Open</button>
</div>

<div class="container" id="content">

    <audio id="music" loop>
        <source src="iris.mp3" type="audio/mpeg">
    </audio>

    <button onclick="document.getElementById('music').play()">
        🎵 turn on the music
    </button>

    <br><br>

    <iframe src="letterr.pdf"></iframe>

</div>

<script>
function checkPassword() {
    const password = document.getElementById("password").value;

    if(password === "IRIS"){
        document.getElementById("login").style.display = "none";
        document.getElementById("content").style.display = "block";
    } else {
        alert("wrong password");
    }
}
</script>

</body>
</html>
