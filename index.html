<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For you</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;

    /* 🌵 ФОН ТЕХАС */
    background: url("texas.jpg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;

    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    text-align:center;
}

/* затемнение */
body::before{
    content:"";
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.55);
    z-index:0;
}

.container{
    position:relative;
    z-index:1;

    max-width:700px;
    padding:30px;

    background: rgba(255,255,255,0.05);
    border-radius:15px;
    backdrop-filter: blur(6px);
}

input{
    width:80%;
    max-width:400px;
    padding:12px;
    border:none;
    border-radius:8px;
    margin-top:15px;
}

button{
    margin-top:15px;
    padding:12px 24px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

#content{
    display:none;
}

iframe{
    width:100%;
    height:80vh;
    border:none;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="container" id="login">
    <h1>the song i associate you with</h1>
    <p>Enter password</p>

    <input type="password" id="password">
    <br>
    <button onclick="checkPassword()">Open</button>
</div>

<div class="container" id="content">

    <h2>💌</h2>

    <iframe src="letterr.pdf"></iframe>

</div>

<script>
function checkPassword() {
    const password = document.getElementById("password").value;

    if(password === "IRIS"){
        document.getElementById("login").style.display = "none";
        document.getElementById("content").style.display = "block";
    } else {
        alert("Wrong password");
    }
}
</script>

</body>
</html>
